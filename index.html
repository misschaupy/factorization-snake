<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>中三數學：因式分解貪吃蛇大作戰</title>
  <style>
    :root {
      --bg-color: #121826;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --correct: #22c55e;
      --wrong: #ef4444;
      --snake-head: #38bdf8;
      --snake-body: #0284c7;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      touch-action: manipulation;
      padding: 0 8px;
    }
    header {
      width: 100%;
      max-width: 600px;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border-bottom: 2px solid #334155;
      border-radius: 0 0 8px 8px;
    }
    h1 { font-size: 1.1rem; color: var(--accent); }
    .status-bar {
      display: flex;
      gap: 12px;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .question-panel {
      width: 100%;
      max-width: 600px;
      background: #0f172a;
      padding: 10px;
      text-align: center;
      border: 1px solid #334155;
      border-radius: 8px;
      margin-top: 8px;
    }
    .question-text {
      font-size: 1.3rem;
      font-weight: bold;
      color: #facc15;
      letter-spacing: 1px;
    }
    .game-container {
      position: relative;
      margin-top: 8px;
      width: 100%;
      max-width: 600px;
      aspect-ratio: 4 / 3;
    }
    canvas {
      background-color: #020617;
      border: 2px solid #334155;
      border-radius: 8px;
      display: block;
      width: 100%;
      height: 100%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    /* 虛擬方向鍵 */
    .d-pad {
      display: grid;
      grid-template-columns: repeat(3, 55px);
      grid-template-rows: repeat(2, 45px);
      gap: 8px;
      margin: 10px auto;
    }
    .d-btn {
      background: var(--card-bg);
      border: 1px solid #475569;
      color: var(--text);
      border-radius: 8px;
      font-size: 1.2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .d-btn:active { background: var(--accent); }
    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }

    /* 彈窗畫面 */
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 10;
      overflow-y: auto;
    }
    .modal-content {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 10px;
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 2px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    select, button {
      width: 100%;
      padding: 8px 12px;
      background: #334155;
      border: 1px solid #475569;
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }
    button.primary-btn {
      background: var(--accent);
      color: #0f172a;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    button.primary-btn:hover { background: var(--accent-hover); }
    .stats-table {
      width: 100%;
      margin: 10px 0;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .stats-table td { padding: 4px; text-align: left; }
    .stats-table td:last-child { text-align: right; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <h1>🐍 因式分解貪吃蛇</h1>
    <div class="status-bar">
      <span>得分: <span id="scoreVal" style="color:var(--accent);">0</span></span>
      <span>生命: <span id="livesVal" style="color:#ef4444;">❤️❤️❤️</span></span>
      <span id="trackerLabel">時間: <span id="trackerVal" style="color:#facc15;">90s</span></span>
    </div>
  </header>

  <div class="question-panel">
    <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:2px;">請操控貪吃蛇吃掉正確的因式分解答案（可安全穿牆）：</div>
    <div class="question-text" id="questionBox">載入中...</div>
  </div>

  <div class="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- 設定選單 -->
    <div class="modal" id="startModal">
      <div class="modal-content">
        <h2 style="margin-bottom:12px; color:var(--accent); font-size:1.3rem;">🎮 遊戲設定</h2>
        
        <div class="form-group">
          <label>1. 學習課題</label>
          <select id="topicSelect">
            <option value="all">綜合混合課題</option>
            <option value="diff_sq">平方差公式：a² - b²</option>
            <option value="perf_sq">完全平方公式：a² ± 2ab + b²</option>
            <option value="cross">十字相乘法：x² + bx + c</option>
          </select>
        </div>

        <div class="form-group">
          <label>2. 程度（變數數量）</label>
          <select id="levelSelect">
            <option value="1">程度一（1 個變數：x）</option>
            <option value="2">程度二（2 個變數：x 與 y）</option>
          </select>
        </div>

        <div class="form-group"
